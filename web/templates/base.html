<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}THINKAGAIN — Adaptive Multi-Agent DSA Tutor{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="top-nav">
        <div class="nav-container">
            <div class="brand">
                <a href="{{ url_for('chatbot_page') }}" class="brand-link">
                    <span class="brand-icon">⚡</span>
                    <span class="brand-title">THINKAGAIN</span>
                </a>
                <span class="brand-badge">Multi-Agent DSA</span>
            </div>
            
            <nav class="nav-links">
                <a href="{{ url_for('chatbot_page') }}" class="nav-link {% if request.path == '/chatbot' %}active{% endif %}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Learn / Chatbot
                </a>
                <a href="{{ url_for('graph_page') }}" class="nav-link {% if request.path == '/graph' %}active{% endif %}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    Agent Flow
                </a>
            </nav>

            <div class="nav-actions">
                <span id="nav-session-indicator" class="session-pill hidden">
                    <span class="session-dot"></span>
                    <span id="nav-session-text">Session</span>
                </span>
                <button id="btn-new-session" class="btn btn-secondary btn-sm" title="Start a fresh learning session">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Session
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
